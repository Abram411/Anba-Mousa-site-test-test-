<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="churchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E2E" />
      <stop offset="100%" stop-color="#0B2E5C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone padding -->
  <rect width="512" height="512" rx="100" fill="url(#churchGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 8" opacity="0.4" />
  
  <!-- Coptic Cross Design -->
  <g fill="url(#goldGrad)">
    <!-- Vertical bar -->
    <rect x="236" y="80" width="40" height="352" rx="10" />
    <!-- Horizontal bar -->
    <rect x="120" y="196" width="272" height="40" rx="10" />
    
    <!-- Central sun / halo -->
    <circle cx="256" cy="216" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
    <circle cx="256" cy="216" r="18" fill="url(#goldGrad)" />
    
    <!-- Cross finial ornaments -->
    <!-- Top -->
    <circle cx="256" cy="74" r="14" />
    <circle cx="236" cy="78" r="10" />
    <circle cx="276" cy="78" r="10" />
    <!-- Bottom -->
    <circle cx="256" cy="438" r="14" />
    <circle cx="236" cy="434" r="10" />
    <circle cx="276" cy="434" r="10" />
    <!-- Left -->
    <circle cx="114" cy="216" r="14" />
    <circle cx="118" cy="196" r="10" />
    <circle cx="118" cy="236" r="10" />
    <!-- Right -->
    <circle cx="398" cy="216" r="14" />
    <circle cx="394" cy="196" r="10" />
    <circle cx="394" cy="236" r="10" />
    
    <!-- Four corner stars (Coptic 4 corners of earth) -->
    <circle cx="180" cy="140" r="10" />
    <circle cx="332" cy="140" r="10" />
    <circle cx="180" cy="292" r="10" />
    <circle cx="332" cy="292" r="10" />
  </g>
</svg>
